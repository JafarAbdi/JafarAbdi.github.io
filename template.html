<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:,">
<link rel="alternate" type="application/atom+xml" title="Jafar Uruç" href="/atom.xml">
</head>
<body>
<header>
<a class="site" href="/">Jafar Uruç</a>
<nav><a href="/about/">about</a><a href="/atom.xml">feed</a></nav>
</header>
<main>
{{content}}
</main>
<dialog id="lightbox"><img alt=""><button aria-label="Close">×</button></dialog>
<script>
const lightbox = document.getElementById("lightbox");
for (const link of document.querySelectorAll("main a:has(> img)")) {
  link.addEventListener("click", (event) => {
    event.preventDefault();
    lightbox.querySelector("img").src = link.href;
    lightbox.showModal();
  });
}
lightbox.addEventListener("click", () => lightbox.close());
</script>
</body>
</html>
